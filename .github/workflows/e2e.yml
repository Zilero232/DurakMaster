name: e2e

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: durakmaster
          POSTGRES_PASSWORD: durakmaster
          POSTGRES_DB: durakmaster
        ports: ['5433:5432']
        options: >-
          --health-cmd "pg_isready -U durakmaster -d durakmaster"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      NODE_ENV: development
      PORT: 4000
      CORS_ORIGINS: http://localhost:8081
      E2E_WEB_URL: http://localhost:8081
      DATABASE_URL: postgresql://durakmaster:durakmaster@localhost:5433/durakmaster?schema=public
      DIRECT_URL: postgresql://durakmaster:durakmaster@localhost:5433/durakmaster?schema=public
      BETTER_AUTH_URL: http://localhost:4000
      BETTER_AUTH_SECRET: ci-secret-not-used-outside-ci

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.1

      - name: Cache the Bun store
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      # --ignore-scripts: the server's postinstall runs `prisma generate`, which
      # the db:push step below runs anyway.
      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Create the database schema
        run: bun --filter @durak-master/server db:push

      - name: Cache the Playwright browser
        id: browser-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('bun.lock') }}

      # The system libraries are outside the cached directory, so --with-deps
      # still runs on a hit; only the browser download is skipped.
      - name: Install the browser
        run: bunx playwright install --with-deps chromium

      - name: Run the end-to-end tests
        run: bun run test:e2e

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: e2e/.results
          retention-days: 7
