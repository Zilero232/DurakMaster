name: e2e

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: durakmaster
          POSTGRES_PASSWORD: durakmaster
          POSTGRES_DB: durakmaster
        ports: ['5433:5432']
        options: >-
          --health-cmd "pg_isready -U durakmaster -d durakmaster"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      NODE_ENV: development
      PORT: 4000
      CORS_ORIGINS: http://localhost:8081
      E2E_WEB_URL: http://localhost:8081
      DATABASE_URL: postgresql://durakmaster:durakmaster@localhost:5433/durakmaster?schema=public
      DIRECT_URL: postgresql://durakmaster:durakmaster@localhost:5433/durakmaster?schema=public
      BETTER_AUTH_URL: http://localhost:4000
      BETTER_AUTH_SECRET: ci-secret-not-used-outside-ci

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.1

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Create the database schema
        run: bun --filter @durak-master/server db:push

      - name: Install the browser
        run: bunx playwright install --with-deps chromium

      - name: Run the end-to-end tests
        run: bun run test:e2e

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: e2e/.results
          retention-days: 7
