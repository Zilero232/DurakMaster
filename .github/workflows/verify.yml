name: verify

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.1

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate the Prisma client
        run: bun --filter @durak-master/server db:generate
        env:
          DIRECT_URL: postgresql://unused:unused@localhost:5432/unused?schema=public

      - name: Typecheck, test, lint and format
        run: bun run verify
