name: release

on:
  workflow_dispatch:
    inputs:
      profile:
        description: EAS build profile
        type: choice
        options: [preview, production]
        default: preview
      rustore:
        description: Publish the build to RuStore after it finishes
        type: boolean
        default: false

# Never run two releases at once: EAS increments versionCode remotely, so a
# parallel build would claim a number the other one expects.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.1

      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Cache the Bun store
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      # --ignore-scripts: the server's postinstall runs `prisma generate`, which
      # reads DIRECT_URL through prisma.config.ts. The client is generated by an
      # explicit step below, with a placeholder URL.
      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Generate the Prisma client
        run: bun --filter @durak-master/server db:generate
        env:
          DIRECT_URL: postgresql://placeholder

      - name: Verify before building
        run: bun run verify

      - name: Build the Android app
        working-directory: apps/mobile
        run: eas build --platform android --profile ${{ inputs.profile }} --non-interactive --wait

      - name: Download the build for RuStore
        if: ${{ inputs.rustore }}
        working-directory: apps/mobile
        run: |
          url=$(eas build:list --platform android --status finished --limit 1 --json --non-interactive | jq -r '.[0].artifacts.buildUrl')
          curl -fsSL "$url" -o "$RUNNER_TEMP/durakmaster.aab"

      - name: Publish to RuStore
        if: ${{ inputs.rustore }}
        run: bun run publish:rustore
        env:
          RUSTORE_KEY_ID: ${{ secrets.RUSTORE_KEY_ID }}
          RUSTORE_PRIVATE_KEY: ${{ secrets.RUSTORE_PRIVATE_KEY }}
          RUSTORE_PACKAGE_NAME: com.durakmaster.app
          RUSTORE_BUNDLE_PATH: ${{ runner.temp }}/durakmaster.aab
          RUSTORE_CONTACT_EMAIL: ${{ secrets.RUSTORE_CONTACT_EMAIL }}
