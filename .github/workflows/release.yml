name: release

on:
  workflow_dispatch:
    inputs:
      profile:
        description: EAS build profile
        type: choice
        options: [preview, production]
        default: preview
      submit:
        description: Submit the build to Google Play after it finishes
        type: boolean
        default: false

# prisma.config.ts resolves DIRECT_URL through env(), which throws when unset —
# and bun install fires the server postinstall that runs prisma generate.
env:
  DATABASE_URL: postgresql://placeholder
  DIRECT_URL: postgresql://placeholder

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.1

      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate the Prisma client
        run: bun --filter @durak-master/server db:generate

      - name: Verify before building
        run: bun run verify

      - name: Build the Android app
        working-directory: apps/mobile
        run: eas build --platform android --profile ${{ inputs.profile }} --non-interactive --wait

      - name: Write the Play service account key
        if: ${{ inputs.submit && inputs.profile == 'production' }}
        run: |
          mkdir -p infra/play-store
          printf '%s' "$PLAY_SERVICE_ACCOUNT" > infra/play-store/service-account.json
        env:
          PLAY_SERVICE_ACCOUNT: ${{ secrets.PLAY_SERVICE_ACCOUNT }}

      - name: Submit to Google Play
        if: ${{ inputs.submit && inputs.profile == 'production' }}
        working-directory: apps/mobile
        run: eas submit --platform android --profile production --non-interactive --latest

      - name: Remove the service account key
        if: always()
        run: rm -f infra/play-store/service-account.json
