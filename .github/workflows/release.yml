name: release

on:
  workflow_dispatch:
    inputs:
      profile:
        description: EAS build profile
        type: choice
        options: [preview, production]
        default: preview
      play:
        description: Submit the build to Google Play (internal track, as a draft)
        type: boolean
        default: false

# Never run two releases at once: EAS increments versionCode remotely, so a
# parallel build would claim a number the other one expects.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.1

      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Cache the Bun store
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      # --ignore-scripts: the server's postinstall runs `prisma generate`, which
      # reads DIRECT_URL through prisma.config.ts. The client is generated by an
      # explicit step below, with a placeholder URL.
      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Generate the Prisma client
        run: bun --filter @durak-master/server db:generate
        env:
          DIRECT_URL: postgresql://placeholder

      - name: Verify before building
        run: bun run verify

      - name: Build the Android app
        working-directory: apps/mobile
        run: eas build --platform android --profile ${{ inputs.profile }} --non-interactive --wait

      # EAS Submit reads the key from the path in eas.json, so the secret is
      # written there and removed again even if the submit fails.
      - name: Write the Play service account key
        if: ${{ inputs.play && inputs.profile == 'production' }}
        working-directory: apps/mobile
        run: printenv GOOGLE_PLAY_SERVICE_ACCOUNT > google-play-key.json
        env:
          GOOGLE_PLAY_SERVICE_ACCOUNT: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT }}

      - name: Submit to Google Play
        if: ${{ inputs.play && inputs.profile == 'production' }}
        working-directory: apps/mobile
        run: eas submit --platform android --profile production --latest --non-interactive

      - name: Remove the Play service account key
        if: ${{ always() && inputs.play && inputs.profile == 'production' }}
        working-directory: apps/mobile
        run: rm -f google-play-key.json
