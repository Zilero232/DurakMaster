# The toolchain for this repo: `mise install` in the repo root.
# Keep each pin in step with what CI and the Dockerfiles use.

min_version = "2026.9.0"

[tools]
# The one bun pin besides the oven/bun tag in apps/server/Dockerfile — bumping bun means both.
# CI installs it from here (.github/actions/setup, jdx/mise-action).
bun = "1.3.1"
# The Expo and EAS CLIs are node scripts: `bun dev:mobile`, `bun android`, and the release workflow's `eas`.
node = "22"
# `bun android` builds the development build locally: React Native 0.86 and expo-modules-core ask
# Gradle for a JDK 17 toolchain, and Android Studio's bundled JDK is 21. Temurin through the github
# backend — the java backend's metadata host (mise-java.jdx.dev) is unreachable from some networks.
# CI builds no Android (EAS does), so .github/actions/setup installs only bun and node.
"github:adoptium/temurin17-binaries" = "jdk-17.0.20+8"

[env]
# Gradle runs on JAVA_HOME; the github backend puts the JDK on PATH but does not set it.
JAVA_HOME = "{{ env.LOCALAPPDATA | default(value=env.HOME ~ '/.local/share') }}/mise/installs/github-adoptium-temurin17-binaries/jdk-17.0.20+8"
