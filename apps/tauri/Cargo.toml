[package]
name = "durakmaster"
version = "0.1.0"
description = "DurakMaster desktop and mobile client"
authors = ["DurakMaster"]
edition = "2021"

[lib]
# Суффикс `_lib` обязателен: на Windows имя библиотеки не должно совпадать
# с именем бинарника, иначе сборка конфликтует.
# https://github.com/rust-lang/cargo/issues/8519
name = "durakmaster_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-os = "2"
tauri-plugin-process = "2"
tauri-plugin-store = "2"
tauri-plugin-deep-link = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Мобильные: отступы под вырез и системные жесты нужны только здесь.
[target.'cfg(any(target_os = "android", target_os = "ios"))'.dependencies]
tauri-plugin-safe-area-insets-css = "0.2"

# Десктоп: обновления и запрет второго экземпляра — на мобильных
# этим управляет система, а плагины туда не собираются.
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
tauri-plugin-updater = "2"
